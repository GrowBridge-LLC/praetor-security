[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "praetor-security"
version = "1.0.0"
description = "Multi-engine static security analysis (SAST, secrets, SCA, AI-security, serialized-model) for code, repos, and AI-agent skills/plugins/MCP servers. Reads, never runs."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = [
    "security", "sast", "secrets", "sca", "static-analysis",
    "prompt-injection", "ai-security", "supply-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

# No runtime dependencies, deliberately.
#
# PRAETOR vets other people's dependencies. A tool that pulled a large dependency
# tree to do that would become its own supply-chain risk -- the thing it exists to
# check. The secrets and AI-security engines are pure stdlib; the SAST and SCA
# engines shell out to external binaries (semgrep, osv-scanner / pip-audit / npm)
# only if they are already installed, and degrade honestly when they are not.
dependencies = []

[project.optional-dependencies]
# The external engines. Installing these is optional -- PRAETOR reports an engine
# as `unavailable` rather than silently reporting zero findings.
sast = ["semgrep"]
sca = ["pip-audit"]
# pyyaml is TEST-ONLY: it parses the bundled ruleset for
# test_bundled_ruleset_is_wellformed.py. It was undeclared, so CI installed
# pytest alone, that module hit `pytest.importorskip`, and six tests silently
# vanished from the run. An undeclared test dependency does not fail -- it skips.
dev = ["pytest>=7", "pyyaml"]

[project.scripts]
praetor = "praetor:main"

[project.urls]
Repository = "https://github.com/GrowBridge-LLC/praetor-security"
Issues = "https://github.com/GrowBridge-LLC/praetor-security/issues"

[tool.setuptools]
package-dir = { "" = "scripts" }
# 🔴 HAND-KEPT, AND IT HAS ALREADY FAILED ONCE. `chains` and `capability`
# shipped in two commits without being added here. Nothing in the test suite
# noticed, because every test imports from the source tree -- the break only
# appears in an INSTALLED wheel, where `interpret.py` raises ImportError on the
# first scan. `tests/test_packaging_declares_every_module.py` now reads this
# list against `scripts/*.py` and fails when they disagree.
py-modules = [
    "praetor", "core", "interpret", "report", "lexctx", "taint",
    "chains", "capability",
    "engine_sast", "engine_secrets", "engine_sca", "engine_aisec", "engine_model",
]

# The bundled offline Semgrep rules.
#
# NOT package-data: that only attaches to a real package, and this project ships
# flat py-modules. Declaring it there built a wheel with no rules in it, so an
# installed `--no-registry` run found nothing. data-files installs relative to
# sys.prefix, which _find_bundled_rules() in praetor.py searches.
[tool.setuptools.data-files]
"share/praetor/rules" = ["rules/semgrep-praetor.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: invariants

# Guards PRAETOR's safety invariants. The one that matters most:
# INVARIANT 1 -- PRAETOR NEVER EXECUTES THE CODE IT SCANS.
#
# That invariant was briefly false (SCA/pip-audit resolved and built an
# attacker-controlled requirements.txt, executing setup.py). The fix is a single
# flag in a single argv list, and until these tests existed nothing would have
# noticed it being deleted.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 🔴 MUST MATCH tests/precommit.sh, WHICH PINS py -3.14.
          #
          # rust/praetor-core/src/unicode_tables.rs is GENERATED from Python's
          # unicodedata, so its content is a function of the interpreter. This
          # job pinned 3.12 (Unicode 15.0.0) while the committed table is 16.0.0,
          # so the parity tests failed on EVERY push for two days -- and a check
          # that is always red carries no information: had the never-execute
          # invariant test started failing, the signal would have been identical.
          #
          # A local gate that pins the interpreter making it pass is a tautology,
          # not a verification. If these two pins ever drift again the generator
          # now says WRONG INTERPRETER rather than STALE, which is the difference
          # between "regenerate" and "regenerating destroys 353 code points".
          python-version: '3.14'

      # Deliberately no requirements install: the invariant tests must not need
      # the tools they guard. They capture argv without executing anything, which
      # is the same property they assert about PRAETOR itself.
      #
      # PyYAML is not one of those tools and not a runtime dependency -- PRAETOR
      # has none, on purpose. It parses the bundled ruleset so
      # test_bundled_ruleset_is_wellformed.py can validate it. Without it that
      # module hit `pytest.importorskip` and CI silently collected SIX FEWER
      # TESTS than either developer machine ("collected 188 items / 1 skipped"),
      # so nothing verified the offline ruleset that IS the SAST engine's
      # coverage under --no-registry.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Run invariant tests
        # 🔴 A SKIPPED TEST IS INDISTINGUISHABLE FROM A PASSING ONE.
        # tests/precommit.sh has always failed on any skip; CI did not, which is
        # how a whole module went missing here unnoticed. Mirrored, so the next
        # importorskip costs a red build instead of silent coverage.
        run: |
          set -o pipefail
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/ -v 2>&1 | tee pytest.out
          if grep -qE '[0-9]+ (skipped|deselected|xfailed)' pytest.out; then
            echo "::error::Tests were skipped or deselected. A skipped test is indistinguishable from a passing one -- install what it needs, or delete it."
            grep -E '[0-9]+ (skipped|deselected|xfailed)|SKIPPED' pytest.out || true
            exit 1
          fi
          # A test-count FLOOR. The skip check above cannot see a deleted file:
          # removing tests/ entirely leaves CI green with '0 passed'. precommit.sh
          # has had MIN_PY since it was written; CI had nothing.
          # NOT anchored with ^ -- pytest -v prints 'collecting ... collected N items',
          # so the line does not START with 'collected'. The anchored version parsed
          # 0 and reddened CI on its first real run: validated as YAML, never run
          # against real pytest output. It failed CLOSED, which is the only reason
          # this was cheap.
          COLLECTED="$(grep -oE 'collected [0-9]+ items' pytest.out | grep -oE '[0-9]+' | head -1)"
          COLLECTED="${COLLECTED:-0}"
          MIN_CI=226
          if [ "$COLLECTED" -lt "$MIN_CI" ]; then
            echo "::error::collected $COLLECTED tests, floor is $MIN_CI -- tests disappeared. Raise MIN_CI deliberately if they were removed on purpose."
            exit 1
          fi

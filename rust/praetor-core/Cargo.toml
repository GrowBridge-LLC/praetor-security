[package]
name = "praetor-core"
description = "PRAETOR scanning engines (Rust port, in progress)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# 🔴 ONE DEPENDENCY, DELIBERATELY.
#
# ADR-001 Amendment 1 authorizes `regex` for the detector ports: Rust has no
# standard-library regex engine, and a bespoke matcher over attacker-controlled
# text would be a larger security risk than this audited finite-automata engine.
# It has no build script or native dependency. This remains a one-entry budget;
# every further crate still needs its own recorded decision.
#
# Adding a dependency is a decision, not a convenience. Record it here when made.
[dependencies]
regex = "=1.13.1"

# PRAETOR bundled Semgrep ruleset.
#
# High-signal, low-false-positive rules that run OFFLINE (no registry needed),
# giving PRAETOR a guaranteed security baseline plus a few agent/AI-specific
# code patterns that the public registry packs do not cover. When the network is
# available, these run ALONGSIDE p/owasp-top-ten and p/security-audit.
#
# License: MIT (same as PRAETOR). Rules authored for PRAETOR; where a pattern is
# a well-known idiom it is expressed independently here.
rules:
  # ----------------------------- Python -----------------------------------
  - id: praetor-py-os-system-concat
    languages: [python]
    severity: ERROR
    message: >
      OS command built from a non-literal and passed to os.system(); attacker-
      controlled input can inject shell commands (CWE-78). Use subprocess with an
      argument list and shell=False.
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
      references: ["https://cwe.mitre.org/data/definitions/78.html"]
    patterns:
      - pattern: os.system(...)
      - pattern-not: os.system("...")

  - id: praetor-py-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >
      subprocess called with shell=True; if any argument is untrusted this is a
      command-injection vector (CWE-78). Pass an argument list and shell=False.
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: subprocess.$F(..., shell=True, ...)

  - id: praetor-py-eval-exec
    languages: [python]
    severity: ERROR
    message: >
      Dynamic code execution via eval()/exec(); if the argument is not a literal
      this is remote code execution (CWE-95). Avoid eval/exec on runtime data.
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
      - pattern-not: eval("...")
      - pattern-not: exec("...")

  - id: praetor-py-yaml-load-unsafe
    languages: [python]
    severity: ERROR
    message: >
      yaml.load() without SafeLoader can instantiate arbitrary Python objects
      (CWE-502 deserialization). Use yaml.safe_load().
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021 Software and Data Integrity Failures"
    patterns:
      - pattern: yaml.load($X)

  - id: praetor-py-pickle-loads
    languages: [python]
    severity: WARNING
    message: >
      pickle deserialization of untrusted data allows arbitrary code execution
      (CWE-502). Use a safe format (JSON) for external data.
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021 Software and Data Integrity Failures"
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)

  - id: praetor-py-requests-verify-false
    languages: [python]
    severity: WARNING
    message: >
      TLS certificate verification disabled (verify=False); this enables
      man-in-the-middle attacks (CWE-295).
    metadata:
      cwe: "CWE-295"
      owasp: "A02:2021 Cryptographic Failures"
    patterns:
      - pattern: requests.$M(..., verify=False, ...)

  - id: praetor-py-flask-debug-true
    languages: [python]
    severity: WARNING
    message: >
      Flask running with debug=True exposes the Werkzeug interactive debugger
      (arbitrary code execution) if reachable (CWE-489).
    metadata:
      cwe: "CWE-489"
      owasp: "A05:2021 Security Misconfiguration"
    patterns:
      - pattern: $APP.run(..., debug=True, ...)

  - id: praetor-py-sql-fstring
    languages: [python]
    severity: ERROR
    message: >
      SQL statement built with an f-string / string concatenation and executed;
      this is SQL injection (CWE-89). Use parameterized queries.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...{$X}...", ...)
          - pattern: $CUR.execute("..." + $X, ...)
          - pattern: $CUR.execute("..." % $X, ...)

  - id: praetor-py-weak-hash
    languages: [python]
    severity: WARNING
    message: >
      Weak cryptographic hash (MD5/SHA1) used; not collision-resistant (CWE-327).
      Use SHA-256+ for security-relevant hashing.
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021 Cryptographic Failures"
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)

  # --------------------------- JavaScript/TS ------------------------------
  - id: praetor-js-child-process-exec-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      child_process.exec() with a non-literal command string is command
      injection (CWE-78). Use execFile()/spawn() with an argument array.
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: (require("child_process")).exec($X, ...)
          - pattern: cp.exec($X + $Y, ...)
          - pattern: exec($X + $Y, ...)
      - pattern-not: exec("...", ...)

  - id: praetor-js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      eval() / new Function() executes dynamic code; with untrusted input this is
      RCE / XSS (CWE-95).
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
      - pattern-not: eval("...")

  - id: praetor-js-innerhtml
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Assignment to innerHTML from a non-literal can introduce DOM XSS (CWE-79).
      Use textContent or a sanitizer.
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern: $EL.innerHTML = $X
      - pattern-not: $EL.innerHTML = "..."

  # ------------------------- AI / agent specific --------------------------
  - id: praetor-ai-llm-output-to-shell
    languages: [python]
    severity: ERROR
    message: >
      LLM/model output flows into a shell/eval sink. Treat model output as
      untrusted; never execute it directly (OWASP LLM02 Insecure Output Handling,
      CWE-78/CWE-95).
    metadata:
      cwe: "CWE-78"
      owasp: "LLM02: Insecure Output Handling"
      references: ["https://owasp.org/www-project-top-10-for-large-language-model-applications/"]
    # TAINT MODE (2026-09-29). The old pattern rule fired on every exec($X),
    # constants included; every attempt to exempt a constant (pattern-not,
    # regex arms, then a one-file AST rebind proof) was bypassed by a new
    # reflective rebind each review round. The rule now fires only when model
    # output reaches a sink, which is what its message says. exec of input(), a
    # parameter or a constant is praetor-py-eval-exec's job, not this rule's.
    #
    # Sources. (1) The model-client CALL result, so any attribute chain, held
    # intermediate (`message = resp.choices[0].message`), loop over content
    # blocks, json.loads, or `await` of it stays tainted, and a rebind of the
    # variable drops the taint:
    #   OpenAI      X.chat.completions.create / X.completions.create /
    #               X.beta.chat.completions.parse / X.responses.create
    #   Anthropic   X.messages.create / X.messages.stream
    #   Ollama      ollama.chat / ollama.generate, and Client/AsyncClient as
    #               X.chat(model=, messages=, ...) / X.generate(model=, prompt=, ...)
    #               (keyword-anchored; bot.chat(message=) and gen.generate(seed=)
    #               measured NOT to match)
    #   Gemini      X.generate_content / X.generate_content_async
    # (2) For a response that arrives as a bare PARAMETER: the OpenAI prefixes a
    #   handler binds (.choices[i], .message, .message.tool_calls[, [j]],
    #   .delta) and the leaf paths (.message.content, .delta.content, .text,
    #   .output_text, tool_calls[j].function.arguments), the same paths through
    #   raw JSON (["choices"][i]["message"]["content"] and tool-call arguments),
    #   Anthropic .content[i].text / .content[i].input, LangChain
    #   .generations[i][j].text, and an Anthropic content-block loop variable:
    #   `for b in X.content:` + `if b.type == "text" | "tool_use":` -> b.text /
    #   b.input, or `"".join(b.text for b in X.content)`. Bare `.content` is never
    #   a source (requests/httpx bodies); measured: iterating
    #   requests.get(u).content, or `for x in obj.content:` without an Anthropic
    #   block-type check, does not fire.
    # OVER-MATCH, documented: the join form matches any `.text` join over any
    # `.content`; X.messages.create / X.responses.create / X.completions.create
    # also name non-LLM APIs (SMS SDKs, Django related managers such as
    # survey.responses.create). Either needs that value to reach an exec sink to
    # be reported, which is itself worth reading. The call source taints echoed
    # metadata too, so .model / .id / .system_fingerprint / .usage / .created are
    # sanitizers.
    # RESIDUAL: model output stored on `self` in one method and executed in
    # another is outside semgrep OSS taint (no cross-method field flow), as is
    # any flow across files.
    # Propagators: list.append / list.extend / file-like .write by side effect,
    # so accumulated stream chunks stay tainted. Booleans are not assumed safe
    # (set explicitly; `content or ""` was measured to propagate without it).
    # Sinks: exec/eval/compile; os.system/os.popen, os.exec*/os.spawn*/
    # os.posix_spawn*, pty.spawn, runpy.run_path/run_module;
    # asyncio.create_subprocess_shell / create_subprocess_exec (ANY argument: exec
    # spreads argv, so `("bash", "-c", model)` is the common shape); subprocess
    # first positional or `args=` argument only, so model text passed as
    # `input=` / `cwd=` / `env=` to a fixed command does not fire. `from X import
    # f` aliases are resolved by semgrep (measured). No sanitizers for content:
    # nothing makes model output safe to run.
    # MEASURED with semgrep 1.175.0; tests/semgrep_live_check.py pins the lines.
    mode: taint
    options:
      taint_assume_safe_booleans: false
    pattern-sources:
      - pattern: $C.chat.completions.create(...)
      - pattern: $C.completions.create(...)
      - pattern: $C.beta.chat.completions.parse(...)
      - pattern: $C.responses.create(...)
      - pattern: $C.messages.create(...)
      - pattern: $C.messages.stream(...)
      - pattern: ollama.chat(...)
      - pattern: ollama.generate(...)
      - pattern: $C.chat(model=$MD, messages=$MS, ...)
      - pattern: $C.generate(model=$MD, prompt=$P, ...)
      - pattern: $C.generate_content(...)
      - pattern: $C.generate_content_async(...)
      - pattern: $R.choices[$I].message.content
      - pattern: $R.choices[$I].message.tool_calls[$J].function.arguments
      - pattern: $R.choices[$I].delta.content
      - pattern: $R.choices[$I].text
      - pattern: $R.output_text
      - pattern: $R.content[$I].text
      - pattern: $R.content[$I].input
      - pattern: $R.generations[$I][$J].text
      - pattern: $R.choices[$I]
      - pattern: $R.choices[$I].message
      - pattern: $R.choices[$I].message.tool_calls
      - pattern: $R.choices[$I].message.tool_calls[$J]
      - pattern: $R.choices[$I].delta
      - pattern: $R["choices"][$I]["message"]["content"]
      - pattern: $R["choices"][$I]["message"]["tool_calls"][$J]["function"]["arguments"]
      - patterns:
          - pattern-inside: |
              for $B in $M.content:
                ...
          - pattern-inside: |
              if $B.type == "$T":
                ...
          - metavariable-regex:
              metavariable: $T
              regex: ^(text|tool_use)$
          - pattern-either:
              - pattern: $B.text
              - pattern: $B.input
      - pattern: $S.join($B.text for $B in $M.content)
      - pattern: $S.join($B.text for $B in $M.content if $COND)
    pattern-propagators:
      - pattern: $L.append($X)
        from: $X
        to: $L
        by-side-effect: true
      - pattern: $L.extend($X)
        from: $X
        to: $L
        by-side-effect: true
      - pattern: $B.write($X)
        from: $X
        to: $B
        by-side-effect: true
    pattern-sanitizers:
      - pattern: $R.model
      - pattern: $R.id
      - pattern: $R.system_fingerprint
      - pattern: $R.usage
      - pattern: $R.created
    pattern-sinks:
      - pattern: exec(...)
      - pattern: eval(...)
      - pattern: compile(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - patterns:
          - pattern: os.$E(...)
          - metavariable-regex:
              metavariable: $E
              regex: ^(exec[lv]p?e?|spawn[lv]p?e?|posix_spawnp?)$
      - pattern: pty.spawn(...)
      - pattern: runpy.run_path(...)
      - pattern: runpy.run_module(...)
      - pattern: asyncio.create_subprocess_shell(...)
      - pattern: asyncio.create_subprocess_exec(...)
      - patterns:
          - pattern: subprocess.$F($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: subprocess.$F(..., args=$X, ...)
          - focus-metavariable: $X

  - id: praetor-ai-hardcoded-system-prompt-secret
    languages: [python, javascript, typescript]
    severity: WARNING
    message: >
      A prompt/message string appears to embed a credential-like token. Secrets in
      prompts leak to the model provider and logs (CWE-522).
    metadata:
      cwe: "CWE-522"
      owasp: "LLM06: Sensitive Information Disclosure"
    patterns:
      - pattern-regex: '(?i)(system|prompt|content)\s*[:=]\s*["'']?[^"''\n]*(sk-[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})'

  # VERIFIED 2026-08-10 against both controls with semgrep 1.172.0 (Linux/WSL --
  # semgrep does not run natively on Windows). Recorded here rather than in a
  # commit message because this is the file a future reader opens:
  #   positive control (visit_Attribute guarded only by startswith("_")) -> 1 finding
  #   negative control (visit_Attribute guarded by an allowlist)          -> 0 findings
  #   `semgrep --validate` on this whole file -> "valid ... 15 rule(s)", 0 errors
  # That last line is not ceremony: semgrep rejects a --config file as a UNIT, so
  # an invalid pattern here would take the other 14 rules down with it for every
  # --no-registry user. This rule was held out of the shipped file until it ran.
  #
  # CVE-2026-53753 (Crawl4AI, CVSS 9.8, pre-auth RCE): an AST sandbox whose
  # attribute denylist only blocked names beginning with an underscore. Python's
  # frame-walking attributes -- gi_frame, f_back, cr_frame, tb_frame, gi_code --
  # carry NO leading underscore, so `(lambda: 0).gi_frame.f_back.f_globals` walks
  # straight out of the sandbox to builtins.
  #
  # 🔴 THE FAILURE MODE, stated because a reader WILL over-read a clean result:
  # this rule matches ONE RECOGNISABLE SHAPE. It does NOT establish that a sandbox
  # is sound -- soundness is undecidable -- and ABSENCE OF THIS FINDING IS NOT
  # EVIDENCE OF SAFETY. Severity is WARNING, not ERROR, for exactly that reason: a
  # confident-looking verdict on an undecidable property is a false negative
  # wearing a badge.
  - id: praetor-py-underscore-only-attribute-denylist
    languages: [python]
    severity: WARNING
    message: >
      Attribute guard keyed solely on a leading underscore. Python's frame-walking
      attributes (gi_frame, f_back, f_globals, cr_frame, tb_frame, gi_code, __class__
      reachable via them) do NOT start with an underscore in every case, so a
      denylist of this shape is escapable -- this is CVE-2026-53753 (Crawl4AI,
      CVSS 9.8, pre-auth RCE via gi_frame/f_back). Deny by ALLOWLIST of permitted
      attributes instead of by prefix. NOTE: absence of this finding does not mean a
      sandbox is sound; this rule matches one known-bad shape, not soundness.
    metadata:
      cwe: "CWE-693"
      owasp: "A04:2021 Insecure Design"
      confidence: MEDIUM
      references:
        - "https://cwe.mitre.org/data/definitions/693.html"
        - "https://docs.python.org/3/reference/datamodel.html#frame-objects"
    patterns:
      - pattern-either:
          # a visitor whose only attribute check is the underscore prefix
          - pattern: |
              def visit_Attribute(self, $NODE):
                  ...
                  if $NODE.attr.startswith("_"):
                      ...
          - pattern: |
              def visit_Attribute(self, $NODE):
                  ...
                  if $A.startswith("_"):
                      ...
          # a getattr wrapper gated the same way
          - pattern: |
              def $FN(..., $NAME, ...):
                  ...
                  if $NAME.startswith("_"):
                      ...
                  ...
                  return getattr(...)
      - pattern-not-inside: |
          if $NAME in $ALLOWED:
              ...
